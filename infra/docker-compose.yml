name: kisan-sahayak

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kisan
      POSTGRES_PASSWORD: kisan
      POSTGRES_DB: kisan
    ports:
      # Host 5433: a local Postgres often occupies 5432; containers use the
      # internal network regardless, so app config is unaffected.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kisan -d kisan"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: ../backend/.env
    environment:
      # Inside the compose network we use service DNS names.
      DATABASE_URL: postgresql+asyncpg://kisan:kisan@postgres:5432/kisan
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../backend:/code
      - ../shared:/shared:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    build:
      context: ../backend
    command: alembic upgrade head
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://kisan:kisan@postgres:5432/kisan
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../backend:/code
      - ../shared:/shared:ro
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ../backend
    command: arq app.workers.runner.WorkerSettings
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://kisan:kisan@postgres:5432/kisan
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../backend:/code
      - ../shared:/shared:ro
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
